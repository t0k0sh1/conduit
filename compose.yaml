services:
  postgres-a:
    build:
      context: ./docker/postgres
      args:
        INIT_DIR: init-a
    image: conduit-postgres-local:a
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "15432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=256m

  postgres-b:
    build:
      context: ./docker/postgres
      args:
        INIT_DIR: init-b
    image: conduit-postgres-local:b
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "25432:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=256m
