<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <title>Conduit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body class="h-screen overflow-hidden bg-[#faf8f4] text-stone-800 antialiased">
    <div class="flex h-full min-h-0 flex-col">
      <!-- Top toolbar -->
      <header
        class="flex shrink-0 select-none items-center gap-0.5 border-b border-stone-200/90 bg-[#f0ebe3] px-2 py-1.5"
      >
        <button
          type="button"
          id="sidebar-toggle"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="Sidebar"
          aria-expanded="true"
          aria-controls="sidebar"
        >
          <span class="sr-only">Toggle sidebar</span>
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 6h16M4 12h16M4 18h7"
            />
          </svg>
        </button>
        <span class="mx-1 h-5 w-px shrink-0 bg-stone-300/90" aria-hidden="true"></span>
        <button
          type="button"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="New query"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </button>
        <button
          type="button"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="Connection"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="Tables"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="Run"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </button>
        <button
          type="button"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="History"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
        </button>
        <span class="flex-1"></span>
        <button
          type="button"
          class="rounded p-1.5 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
          title="Settings"
        >
          <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
            />
          </svg>
        </button>
      </header>

      <!-- Body: sidebar + main -->
      <div class="flex min-h-0 flex-1">
        <aside
          id="sidebar"
          style="width: 256px"
          class="flex shrink-0 select-none flex-col overflow-hidden border-r border-stone-200/90 bg-[#f3efe6] transition-[width,opacity] duration-200 ease-out"
        >
          <div
            class="flex shrink-0 items-center justify-between gap-2 border-b border-stone-200/90 px-2 py-2"
          >
            <span class="text-xs font-medium uppercase tracking-wide text-stone-500">Objects</span>
            <div class="flex shrink-0 items-center gap-0.5">
              <button
                type="button"
                id="add-connection-btn"
                class="rounded p-1 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900"
                title="Add database"
                aria-label="Add database"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M12 4v16m8-8H4"
                  />
                </svg>
              </button>
              <button
                type="button"
                id="edit-connection-btn"
                disabled
                class="rounded p-1 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-stone-600"
                title="Edit database"
                aria-label="Edit database"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"
                  />
                </svg>
              </button>
              <button
                type="button"
                id="remove-connection-btn"
                disabled
                class="rounded p-1 text-stone-600 hover:bg-stone-200/90 hover:text-stone-900 disabled:cursor-not-allowed disabled:opacity-40 disabled:hover:bg-transparent disabled:hover:text-stone-600"
                title="Remove database"
                aria-label="Remove database"
              >
                <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"
                  />
                </svg>
              </button>
            </div>
          </div>
          <nav
            id="connection-tree-nav"
            class="min-h-0 flex-1 overflow-y-auto px-2 py-2 text-sm"
            aria-label="Connection tree"
          >
            <ul id="connections-list" class="space-y-0.5"></ul>
          </nav>
        </aside>

        <div
          id="sidebar-resize-handle"
          role="separator"
          aria-orientation="vertical"
          aria-label="Resize sidebar"
          title="Resize sidebar"
          tabindex="0"
          class="w-1 shrink-0 cursor-col-resize touch-none bg-stone-200/40 hover:bg-stone-300/80"
        ></div>

        <main class="flex min-h-0 min-w-0 flex-1 flex-col bg-[#faf8f4]">
          <div
            id="table-preview-area"
            class="hidden flex min-h-0 min-w-0 flex-1 flex-col"
          >
          <div
            id="table-preview-tabs"
            role="tablist"
            aria-label="Table previews"
            class="flex shrink-0 min-h-0 select-none items-center gap-1 overflow-x-auto border-b border-stone-200/90 bg-[#f3efe6]/80 px-2 py-1"
          ></div>
          <div class="min-h-0 flex-1 p-3">
            <div
              id="table-preview-panels"
              class="flex h-full min-h-[12rem] flex-col"
            ></div>
          </div>
          </div>
        </main>
      </div>

      <!-- Status bar -->
      <footer
        class="flex shrink-0 select-none items-center justify-between gap-4 border-t border-stone-200/90 bg-[#f0ebe3] px-3 py-1.5 text-xs text-stone-600"
        role="status"
        aria-live="polite"
      >
        <span id="status-message" class="min-w-0 truncate">Ready</span>
        <div class="flex shrink-0 items-center gap-2 text-stone-500">
          <span id="status-detail" class="hidden sm:inline">Line 1, column 1</span>
          <span class="text-stone-300" aria-hidden="true">|</span>
          <span>UTF-8</span>
        </div>
      </footer>
    </div>

    <div
      id="connection-tree-context-menu"
      role="menu"
      class="hidden fixed z-[100] min-w-[12rem] select-none rounded-md border border-stone-200/90 bg-[#f3efe6] py-1 text-sm text-stone-800 shadow-lg shadow-stone-300/40"
    >
      <button
        type="button"
        role="menuitem"
        id="context-add-connection"
        class="w-full px-3 py-1.5 text-left hover:bg-stone-200/90"
      >
        Add database
      </button>
      <div role="separator" class="my-1 border-t border-stone-200/90"></div>
      <button
        type="button"
        role="menuitem"
        id="context-open-connection"
        disabled
        class="w-full px-3 py-1.5 text-left hover:bg-stone-200/90 disabled:cursor-default disabled:text-stone-400 disabled:hover:bg-transparent"
      >
        Open database
      </button>
      <button
        type="button"
        role="menuitem"
        id="context-close-connection"
        disabled
        class="w-full px-3 py-1.5 text-left hover:bg-stone-200/90 disabled:cursor-default disabled:text-stone-400 disabled:hover:bg-transparent"
      >
        Close database
      </button>
      <div role="separator" class="my-1 border-t border-stone-200/90"></div>
      <button
        type="button"
        role="menuitem"
        id="context-edit-connection"
        disabled
        class="w-full px-3 py-1.5 text-left hover:bg-stone-200/90 disabled:cursor-default disabled:text-stone-400 disabled:hover:bg-transparent"
      >
        Edit database
      </button>
      <button
        type="button"
        role="menuitem"
        id="context-delete-connection"
        disabled
        class="w-full px-3 py-1.5 text-left text-red-800 hover:bg-stone-200/90 disabled:cursor-default disabled:text-stone-400 disabled:hover:bg-transparent"
      >
        Delete database
      </button>
    </div>

    <dialog
      id="connection-wizard-dialog"
      class="w-[min(100vw-2rem,28rem)] max-h-[min(90vh,40rem)] select-none rounded-lg border border-stone-200/90 bg-[#fffcf7] p-0 text-stone-800 shadow-xl backdrop:bg-stone-900/40"
    >
      <form
        id="connection-wizard-form"
        class="flex max-h-[min(90vh,40rem)] flex-col"
        autocomplete="off"
      >
        <div class="border-b border-stone-200/80 px-4 py-3">
          <h2 id="wizard-dialog-title" class="text-sm font-semibold text-stone-900">Add database connection</h2>
          <p class="mt-0.5 text-xs text-stone-500">Step 1 / 1</p>
        </div>
        <div id="wizard-steps" class="min-h-0 flex-1 overflow-y-auto px-4 py-3">
          <div data-wizard-step="1" class="flex flex-col gap-3">
            <label class="block text-xs font-medium text-stone-600">
              Display name
              <input
                name="label"
                type="text"
                required
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
              />
            </label>
            <label class="block text-xs font-medium text-stone-600">
              Host
              <input
                name="host"
                type="text"
                required
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
              />
            </label>
            <label class="block text-xs font-medium text-stone-600">
              Port
              <input
                name="port"
                type="number"
                required
                min="1"
                max="65535"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
              />
            </label>
            <label class="block text-xs font-medium text-stone-600">
              Database
              <input
                name="database"
                type="text"
                required
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
              />
            </label>
            <label class="block text-xs font-medium text-stone-600">
              User
              <input
                name="user"
                type="text"
                required
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
              />
            </label>
            <label class="flex cursor-pointer items-start gap-2 text-xs text-stone-600">
              <input
                id="wizard-save-password"
                type="checkbox"
                class="mt-0.5 h-3.5 w-3.5 shrink-0 rounded border-stone-300 text-amber-800 focus:ring-amber-700/40"
              />
              <span>Save password in profile</span>
            </label>
            <label class="block text-xs font-medium text-stone-600">
              Password
              <input
                id="wizard-password"
                name="password"
                type="password"
                autocomplete="off"
                autocapitalize="off"
                autocorrect="off"
                spellcheck="false"
                class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
              />
              <p class="mt-1 font-normal text-stone-500">
                If you do not save the password in the profile, you can still enter it here for connection testing; it
                is not stored on disk.
              </p>
            </label>
          </div>
        </div>
        <p id="wizard-error" class="hidden select-text px-4 text-xs text-red-700" role="alert"></p>
        <p id="wizard-success" class="mb-2.5 hidden select-text px-4 text-xs text-green-800" role="status"></p>
        <div class="flex shrink-0 items-center justify-between gap-2 border-t border-stone-200/80 px-4 py-3">
          <button
            type="button"
            id="wizard-test-connection"
            class="rounded border border-stone-200/90 bg-[#f3efe6] px-3 py-1.5 text-xs font-medium text-stone-800 hover:bg-stone-200/90"
          >
            <span id="wizard-test-connection-label">Test connection</span>
          </button>
          <div class="flex shrink-0 gap-2">
            <button
              type="button"
              id="wizard-cancel"
              class="rounded border border-stone-200/90 bg-[#f3efe6] px-3 py-1.5 text-xs font-medium text-stone-800 hover:bg-stone-200/90"
            >
              Cancel
            </button>
            <button
              type="submit"
              id="wizard-submit"
              class="rounded border border-amber-800/40 bg-amber-900/90 px-3 py-1.5 text-xs font-medium text-[#fffcf7] hover:bg-amber-950"
            >
              <span id="wizard-submit-label">Add</span>
            </button>
          </div>
        </div>
      </form>
    </dialog>

    <dialog
      id="delete-connection-dialog"
      class="w-[min(100vw-2rem,24rem)] select-none rounded-lg border border-stone-200/90 bg-[#fffcf7] p-0 text-stone-800 shadow-xl backdrop:bg-stone-900/40"
    >
      <div class="px-4 py-3">
        <h2 class="text-sm font-semibold text-stone-900">Remove database connection</h2>
        <p id="delete-connection-message" class="mt-2 select-text text-sm text-stone-600"></p>
        <p class="mt-2 select-text text-xs text-stone-500">
          This removes the saved connection and any stored credentials for it from this device.
        </p>
      </div>
      <div class="flex shrink-0 justify-end gap-2 border-t border-stone-200/80 px-4 py-3">
        <button
          type="button"
          id="delete-connection-cancel"
          class="rounded border border-stone-200/90 bg-[#f3efe6] px-3 py-1.5 text-xs font-medium text-stone-800 hover:bg-stone-200/90"
        >
          Cancel
        </button>
        <button
          type="button"
          id="delete-connection-confirm"
          class="rounded border border-red-800/40 bg-red-800 px-3 py-1.5 text-xs font-medium text-[#fffcf7] hover:bg-red-900"
        >
          Delete
        </button>
      </div>
    </dialog>

    <dialog
      id="session-password-dialog"
      class="w-[min(100vw-2rem,24rem)] select-none rounded-lg border border-stone-200/90 bg-[#fffcf7] p-0 text-stone-800 shadow-xl backdrop:bg-stone-900/40"
    >
      <form id="session-password-form" class="flex flex-col" autocomplete="off">
        <div class="px-4 py-3">
          <h2 class="text-sm font-semibold text-stone-900">Connect to database</h2>
          <p id="session-password-description" class="mt-2 select-text text-sm text-stone-600"></p>
          <label class="mt-3 block text-xs font-medium text-stone-600">
            Password
            <input
              id="session-password-input"
              name="sessionPassword"
              type="password"
              autocomplete="off"
              autocapitalize="off"
              autocorrect="off"
              spellcheck="false"
              class="mt-1 w-full select-text rounded border border-stone-200/90 bg-[#faf8f4] px-2 py-1.5 text-sm text-stone-900 outline-none ring-stone-400/30 focus:border-stone-400 focus:ring-2"
            />
          </label>
          <p id="session-password-error" class="mt-2 hidden select-text text-xs text-red-700" role="alert"></p>
        </div>
        <div class="flex shrink-0 justify-end gap-2 border-t border-stone-200/80 px-4 py-3">
          <button
            type="button"
            id="session-password-cancel"
            class="rounded border border-stone-200/90 bg-[#f3efe6] px-3 py-1.5 text-xs font-medium text-stone-800 hover:bg-stone-200/90"
          >
            Cancel
          </button>
          <button
            type="submit"
            id="session-password-submit"
            class="rounded border border-amber-800/40 bg-amber-900/90 px-3 py-1.5 text-xs font-medium text-[#fffcf7] hover:bg-amber-950"
          >
            Connect
          </button>
        </div>
      </form>
    </dialog>
  </body>
</html>
